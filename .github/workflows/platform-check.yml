name: platform
on: [workflow_call]
permissions: {contents: read}
jobs:
  platform-check:
    name: platform-check
    runs-on: xenomit-platform
    environment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'fork-ci' || 'internal-ci' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install validation tools inside the ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 shellcheck
          curl -fsSL https://github.com/opentofu/opentofu/releases/download/v1.12.6/tofu_1.12.6_linux_amd64.zip -o "$RUNNER_TEMP/tofu.zip"
          unzip -q "$RUNNER_TEMP/tofu.zip" -d "$RUNNER_TEMP/tofu"
          chmod +x "$RUNNER_TEMP/tofu/tofu"
          echo "$RUNNER_TEMP/tofu" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh
