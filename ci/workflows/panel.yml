# Web panel lint + unit/contract tests (docs/07 §7.2 stages 1–2).
# Placement: <repo-root>/.github/workflows/panel.yml once the monorepo exists.
name: panel

on:
  pull_request:
    paths:
      - "xenomit-web-panel/**"
      - "ci/workflows/panel.yml"
      - ".github/workflows/panel.yml"
  push:
    branches: [main]
    paths:
      - "xenomit-web-panel/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: web-panel
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 20
    container:
      image: node:22-bookworm
    defaults:
      run:
        working-directory: xenomit-web-panel
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('xenomit-web-panel/package-lock.json') }}
          restore-keys: npm-

      # `npm ci` also runs postinstall → `prisma generate`, needed for tsc.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck   # tsc --noEmit

      # vitest run — includes the protocol contract tests
      # (tests/protocol.test.ts, tests/managed-protocol.test.ts) per docs/07 §7.2.
      - name: test
        run: npm test
