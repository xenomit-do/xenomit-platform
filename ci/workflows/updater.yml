# Packet-updater lint + tests (docs/07 §7.2 stage 1: ruff/pytest).
# Placement: <repo-root>/.github/workflows/updater.yml once the monorepo exists.
name: packet-updater

on:
  pull_request:
    paths:
      - "xenomit-packet-updater/**"
      # The updater rewrites these trees; keep it exercised when they change.
      - "xenomit-packet-client/tools/**"
      - "ci/workflows/updater.yml"
      - ".github/workflows/updater.yml"
  push:
    branches: [main]
    paths:
      - "xenomit-packet-updater/**"
      - "xenomit-packet-client/tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updater-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: packet-updater
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 15
    container:
      # Full (non-slim) image: -slim has no git, and actions/checkout is a
      # JS action that needs git inside the job container.
      image: python:3.13-bookworm
    defaults:
      run:
        working-directory: xenomit-packet-updater
    steps:
      - uses: actions/checkout@v4

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('xenomit-packet-updater/pyproject.toml') }}
          restore-keys: pip-

      # ruff is not a runtime dep; install beside pytest (pin when the repo
      # lands — a floating linter is fine for a private tool, but a lock
      # keeps CI reproducible).
      - run: python -m pip install -e ".[dev]" ruff

      - name: ruff
        run: ruff check src tests

      - name: pytest
        run: python -m pytest
