apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudflared, namespace: ci}
spec:
  replicas: 1
  selector: {matchLabels: {app: cloudflared}}
  template:
    metadata: {labels: {app: cloudflared}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args: [tunnel, --no-autoupdate, --metrics, '0.0.0.0:2000', run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: cloudflare-tunnel, key: token}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
          readinessProbe: {httpGet: {path: /ready, port: 2000}}
