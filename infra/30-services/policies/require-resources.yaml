# Phase 9 admission policy: every container in the xenomit workload
# namespaces must declare cpu+memory requests AND limits (docs/09 §9.2,
# docs/11 §11.3 resource budget). The fleet quota in
# manifests/platform/20-resource-limits.yaml bounds the namespace total; this rule bounds
# the individual pod — an unbounded pod can still starve 49 siblings inside
# the quota.
#
# Note on bot pods: the operator renders requests only and relies on the
# xenomit-bots LimitRange to inject limits at admission (LimitRange runs
# before validating webhooks, so the object Kyverno evaluates already carries
# them). If the LimitRange is ever removed, bot pods lacking explicit limits
# will be REJECTED here — fail-closed, and the operator change to render
# limits directly is tracked in docs/security-review-rbac.md.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: xenomit-require-resources
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Require cpu/memory requests and limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container must declare requests and limits for cpu and memory —
      the single-node budget in docs/11 §11.3 only works if nothing can run
      unbounded.
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true
  rules:
    - name: containers-declare-requests-and-limits
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      exclude:
        any:
          - resources:
              selector:
                matchLabels: {app.kubernetes.io/name: vault}
      validate:
        message: >-
          Every container must declare resources.requests.{cpu,memory} and
          resources.limits.{cpu,memory} (docs/11 §11.3).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
