# Phase 9 hardening (docs/security-review-rbac.md F6): the `default`
# ServiceAccount in every xenomit namespace must NOT automount an API token.
#
# Why: any pod created without an explicit serviceAccountName gets `default`
# — a forgotten SA field should mean "no API identity", not "an API identity
# nobody asked for". Pod specs that genuinely need a token set
# automountServiceAccountToken explicitly (or use a dedicated SA), so this
# changes nothing for them; it only removes ambient credentials from
# ad-hoc/debug pods. The Kyverno policy xenomit-no-automounted-sa-token
# additionally REQUIRES the explicit pod-level flag in xenomit-bots.
#
# Applied by patch-style apply: the `default` SA is created by the API
# server; `kubectl apply` merges this one field onto it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: xenomit-bots
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: xenomit-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: xenomit-data
automountServiceAccountToken: false
