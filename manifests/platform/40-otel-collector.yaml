# otel-collector as a node-local DaemonSet (docs/06 §6.7): bots emit OTLP to
# http://$(NODE_IP):4317 so telemetry doesn't depend on a Service hop. The
# collector enriches with k8s attributes, redacts secrets as a second line of
# defense (docs/06 §6.5), tail-samples, and forwards OTLP/HTTP to OpenObserve
# in the same namespace. OPENOBSERVE_AUTHORIZATION comes from the
# openobserve-auth Secret.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
---
# k8sattributes + k8s_cluster need read on pods/namespaces and the usual
# workload objects. Read-only, cluster-wide (no secrets).
# Read-only, cluster-wide and limited to the Kubernetes resources watched by
# the configured k8s_cluster receiver and k8sattributes processor. The
# receiver requires list/watch even for resource kinds with no current objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: opentelemetry-collector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes, services, endpoints, resourcequotas, replicationcontrollers]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets, deployments, daemonsets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      # Cluster-level metrics (docs/06 §6.1).
      k8s_cluster:
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure]
        allocatable_types_to_report: [cpu, memory]
      # Vault /v1/sys/metrics for the sealed-Vault + Vault-down alerts
      # (docs/09 §9.2a). Vault is a Docker container reached via the
      # vault.xenomit-system ExternalName; TLS is verified with the vault-ca
      # ConfigMap (bootstrap step 8 creates it in this namespace too). Vault
      # must have the telemetry stanza from ops/vault/vault.hcl applied.
      prometheus:
        config:
          scrape_configs:
            - job_name: vault
              scheme: https
              scrape_interval: 30s
              metrics_path: /v1/sys/metrics
              params:
                format: [prometheus]
              tls_config:
                ca_file: /etc/vault-ca/ca.crt
              static_configs:
                - targets: ["vault.xenomit-system.svc.cluster.local:8200"]

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 400
        spike_limit_mib: 100
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.pod.start_time
          labels:
            - tag_name: xenomit.bot.id
              key: xenomit.io/bot
              from: pod
            - tag_name: xenomit.tenant
              key: xenomit.io/tenant
              from: pod
            - tag_name: xenomit.bot.epoch
              key: xenomit.io/epoch
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
      attributes:
        actions:
          - key: deployment.environment
            value: local
            action: upsert
      # Second line of defense after SDK redaction (docs/06 §6.5).
      # allow_all_keys=false + allowed_keys = every attribute NOT listed is
      # dropped before it can leak a credential; blocked_values additionally
      # masks session-id-shaped values inside allowed attributes.
      redaction:
        allow_all_keys: false
        allowed_keys:
          - service.name
          - service.version
          - service.instance.id
          - deployment.environment
          - xenomit.bot.id
          - xenomit.tenant
          - xenomit.bot.epoch
          - xenomit.account.hash
          - xenomit.packet.schema
          - k8s.namespace.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
        blocked_values:
          - "dosid=[^\\s&]+"
          - "sid=[^\\s&]+"
        summary: debug
      # This pinned version lacks metric support in redaction; metric attributes are allow-listed.
      transform/metrics:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment", "xenomit.bot.id", "xenomit.tenant", "xenomit.bot.epoch", "xenomit.account.hash", "xenomit.packet.schema", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name"])
              - truncate_all(attributes, 4096)
          - context: datapoint
            statements:
              - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment", "xenomit.bot.id", "xenomit.tenant", "xenomit.bot.epoch", "xenomit.account.hash", "xenomit.packet.schema", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name"])
              - truncate_all(attributes, 4096)
      # The pinned redaction processor supports traces only; sanitize logs with OTTL.
      transform/logs:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment", "xenomit.bot.id", "xenomit.tenant", "xenomit.bot.epoch", "xenomit.account.hash", "xenomit.packet.schema", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name"])
              - truncate_all(attributes, 4096)
          - context: log
            statements:
              - keep_keys(attributes, ["service.name", "service.version", "service.instance.id", "deployment.environment", "xenomit.bot.id", "xenomit.tenant", "xenomit.bot.epoch", "xenomit.account.hash", "xenomit.packet.schema", "k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name"])
              - replace_pattern(body, "(?i)(dosid|sid)=.*", "[REDACTED]") where IsString(body) and IsMatch(body, "(?i)(dosid|sid)=")
              - replace_all_patterns(attributes, "value", "(?i)(dosid|sid)=.*", "[REDACTED]")
              - truncate_all(attributes, 4096)      # docs/06 §6.4: keep errors, keep slow (> ~p95) spans, 5% baseline.
      tail_sampling:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 64
        policies:
          - name: keep-errors
            type: status_code
            status_code: { status_codes: [ERROR] }
          - name: keep-slow
            type: latency
            latency: { threshold_ms: 5000 }
          - name: baseline-5pct
            type: probabilistic
            probabilistic: { sampling_percentage: 5 }
      batch:
        timeout: 5s
        send_batch_size: 8192
        send_batch_max_size: 10000

    exporters:
      otlphttp/openobserve:
        endpoint: http://openobserve.observability.svc.cluster.local:5080/api/default
        headers:
          Authorization: ${env:OPENOBSERVE_AUTHORIZATION}
          stream-name: default
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 0s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 10000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes, redaction, tail_sampling, batch]
          exporters: [otlphttp/openobserve]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes, transform/logs, batch]
          exporters: [otlphttp/openobserve]
        metrics:
          receivers: [otlp, k8s_cluster]
          processors: [memory_limiter, k8sattributes, attributes, transform/metrics, batch]
          exporters: [otlphttp/openobserve]
        # Vault metrics get their own pipeline: k8sattributes runs
        # passthrough=false — vault metrics aren't pod-associated and would
        # be dropped from the shared pipeline. The metric allow-list still applies
        # (service.name survives; scrape labels are operational, not secret).
        metrics/vault:
          receivers: [prometheus]
          processors: [memory_limiter, transform/metrics, batch]
          exporters: [otlphttp/openobserve]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/part-of: xenomit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-collector
        app.kubernetes.io/part-of: xenomit
    spec:
      serviceAccountName: otel-collector
      automountServiceAccountToken: true   # k8sattributes auth_type: serviceAccount
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.98.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/collector/collector.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: OPENOBSERVE_AUTHORIZATION
              valueFrom:
                secretKeyRef: { name: openobserve-auth, key: authorization }
          ports:
            - { containerPort: 4317, hostPort: 4317, name: otlp-grpc, protocol: TCP }
            - { containerPort: 13133, name: health }
          volumeMounts:
            - { name: config, mountPath: /etc/collector, readOnly: true }
            - { name: vault-ca, mountPath: /etc/vault-ca, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: 13133 }
          livenessProbe:
            httpGet: { path: /, port: 13133 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        # bootstrap step 8 publishes the Vault CA into this namespace.
        - name: vault-ca
          configMap: { name: vault-ca }
