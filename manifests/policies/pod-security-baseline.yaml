# Phase 9 admission policy: pod hardening floor for the xenomit workload
# namespaces (docs/09 §9.2 "Pod hardening"). These are the properties the
# platform's own manifests already honor — the policy makes them a contract
# admission enforces, not a convention.
#
# Scope: xenomit-bots, xenomit-system, xenomit-data. The observability and ci
# namespaces run third-party images (OpenObserve, the collector's hostPort, ARC
# runner pods) that legitimately need different properties — they're out of
# scope by design (ci/policies/README.md §Scope). Nothing in the three in-scope
# namespaces needs hostNetwork/hostPort, so those are not separately listed.
#
# Pattern idioms used below (Kyverno validate patterns):
#   - field        required key, value must match
#   - =(field)     conditional: IF the key exists it must match (absent is OK)
#   - "null"       a present object/value fails a null match -> "must not be set"
#   - anyPattern   at least one of the listed patterns must match
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: xenomit-pod-security
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Xenomit pod security floor
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods in the xenomit workload namespaces must run non-root, unprivileged,
      with no privilege escalation, all capabilities dropped, a seccomp
      profile, and no hostPath volumes or host namespaces (docs/09 §9.2).
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: true          # also evaluates already-running pods into policy reports
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: "Privileged containers are forbidden (docs/09 §9.2)."
        pattern:
          spec:
            =(containers):
              - =(securityContext):
                  =(privileged): "false"
            =(initContainers):
              - =(securityContext):
                  =(privileged): "false"
            =(ephemeralContainers):
              - =(securityContext):
                  =(privileged): "false"
    - name: no-hostpath-volumes
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: "hostPath volumes are forbidden — no dependence on node-local paths (docs/11 §11.6)."
        pattern:
          spec:
            =(volumes):
              - =(hostPath): "null"
    - name: no-host-namespaces
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: "hostNetwork/hostPID/hostIPC are forbidden in xenomit namespaces."
        pattern:
          spec:
            =(hostNetwork): "false"
            =(hostPID): "false"
            =(hostIPC): "false"
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: >-
          Pods must run as non-root — set securityContext.runAsNonRoot at pod
          level or on every container (docs/09 §9.2).
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: "true"
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: "true"
              =(initContainers):
                - securityContext:
                    runAsNonRoot: "true"
              =(ephemeralContainers):
                - securityContext:
                    runAsNonRoot: "true"
    - name: no-privilege-escalation
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: "Every container must set securityContext.allowPrivilegeEscalation: false."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: "false"
            =(initContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
            =(ephemeralContainers):
              - securityContext:
                  allowPrivilegeEscalation: "false"
    - name: drop-all-capabilities
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: "Every container must drop all Linux capabilities (capabilities.drop contains ALL)."
        pattern:
          spec:
            containers:
              - securityContext:
                  capabilities:
                    drop: ["ALL"]
            =(initContainers):
              - securityContext:
                  capabilities:
                    drop: ["ALL"]
            =(ephemeralContainers):
              - securityContext:
                  capabilities:
                    drop: ["ALL"]
    - name: seccomp-runtime-default
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system", "xenomit-data"]
      validate:
        message: >-
          A seccomp profile is required — securityContext.seccompProfile.type:
          RuntimeDefault at pod or container level.
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              containers:
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
              =(initContainers):
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
              =(ephemeralContainers):
                - securityContext:
                    seccompProfile:
                      type: RuntimeDefault
