# Phase 9 admission policy (docs/09 §9.2 "Supply chain", docs/07 §7.2).
# Only digest-pinned images from the local registry may run in the xenomit
# workload namespaces — the cosign signature check is the sibling policy in
# verify-signed-images.yaml (split so `kyverno test` can exercise this file
# fully offline: verifyImages needs a live registry).
# Kyverno — see ADR-25 for the choice.
#
# Scope: Pods in xenomit-bots and xenomit-system (the namespaces that run OUR
# images). xenomit-data (postgres:16-alpine), observability and ci run
# third-party images we do not sign — see policies/README.md.
#
# Exemption: pods labeled xenomit.io/verify are excluded. Anyone who can create pods in xenomit-bots
# already holds equivalent trust (the operator), and the other four policies
# still apply to verify pods — they run non-root, capped, with limits and
# labels like everything else.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: xenomit-require-signed-image
  annotations:
    # After the kyverno chart itself in the Argo sync (ops/argocd/apps/15-admission.yaml).
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Require digest-pinned local-registry images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Every container image in xenomit-bots / xenomit-system must come from
      the k3d local registry, be pinned by sha256 digest, and carry a cosign
      signature made by the CI signing key (docs/07 §7.2 images workflow).
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail       # closed posture: kyverno errors deny, not wave through
  background: false         # admission-time control; retro-audit is the report controller's job
  rules:
    - name: image-is-local-registry-by-digest
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["xenomit-bots", "xenomit-system"]
      exclude:
        any:
          - resources:
              selector:
                matchExpressions:
                  - { key: "xenomit.io/verify", operator: Exists }
      validate:
        message: >-
          Pods in xenomit namespaces must run
          xenomit-registry:5000/<image>@sha256:<digest>. Tags are mutable
          and foreign registries are not signed by our pipeline — rollouts
          promote by digest only (docs/07 §7.2).
        pattern:
          spec:
            containers:
              - image: "xenomit-registry:5000/*@sha256:*"
            =(initContainers):
              - image: "xenomit-registry:5000/*@sha256:*"
            =(ephemeralContainers):
              - image: "xenomit-registry:5000/*@sha256:*"
