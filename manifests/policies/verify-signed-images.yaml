# Phase 9 image signature enforcement for the local k3d registry.
# ImageValidatingPolicy is used because the registry is plain HTTP and this
# API exposes credentials.allowInsecureRegistry while keeping signature
# failures in Deny mode. The digest format remains enforced by the sibling
# require-signed-images policy.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: xenomit-verify-signed-image
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    policies.kyverno.io/title: Verify Cosign signatures
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  validationActions:
    - Deny
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "xenomit-registry:5000/*"
  credentials:
    allowInsecureRegistry: true
    providers: ["default"]
  attestors:
    - name: cosign
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEDoZwazPZ4bY25rN8fp9pkMlC6j+f
            +C16+Hb+jVPMF1d8cGfWUzleVr/FfPyQzS064UonCs54rzxVTUQN3cicDA==
            -----END PUBLIC KEY-----
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: Every image from the local registry must have a valid Cosign signature from the trusted key.
