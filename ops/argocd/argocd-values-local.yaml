# Argo CD local profile (docs/11 §11.8). Chart argo/argo-cd PINNED (see
# bootstrap/1-services/variables.tf, currently 9.5.15, appVersion v3.4.2).
# Installed by bootstrap/1-services as a helm_release; the account passwords are
# generated there and merged on top of this file.
#
# Before bumping the chart pin, run `helm show values argo/argo-cd
# --version <v>` and reconcile renamed keys — chart internals move.
#
# Sizing (docs/11 §11.3): the whole stack below is ~1 GiB of limits, ~0.6 GiB
# of requests — one of the cheaper line items; SigNoz stays the heavy one.
# Deliberately OFF: dex (no SSO locally), notifications (not worth a pod),
# redis-ha and every second replica (single-node cluster, HA buys nothing),
# commitServer (Source Hydrator unused). ApplicationSet can't be disabled in
# this chart version — it gets a tiny footprint instead.

global:
  domain: ""                 # no ingress/DNS — host UI is the loopback publish
  revisionHistoryLimit: 3
  networkPolicy:
    create: false            # argocd/git namespaces sit outside the ops netpol set (README)

controller:
  replicas: 1
  # Heaviest component — it *watches* all resources in the project namespaces
  # (incl. ~50 bot pods it never manages) for the orphaned-resources view.
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 1Gi }

repoServer:
  replicas: 1                # renders kustomize for 4 small apps — cheap
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

server:
  replicas: 1
  service:
    type: ClusterIP          # host UI: ops/k3d/localhost-core.yaml on 127.0.0.1:8080
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 250m, memory: 256Mi }

applicationSet:
  replicas: 1                # unused (no ApplicationSets) — chart always deploys it
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 100m, memory: 128Mi }

commitServer:
  enabled: false
dex:
  enabled: false
notifications:
  enabled: false
redis-ha:
  enabled: false
redis:
  enabled: true
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }

configs:
  params:
    # Plain HTTP inside the cluster. The host reaches it only through the
    # loopback NodePort on 127.0.0.1:8080. Never publish that port on a
    # routable interface while insecure is on.
    server.insecure: true
  cm:
    admin.enabled: true      # owner account — password generated by bootstrap/1-services
    accounts.viewer: "apiKey, login"   # read-only account — password generated
                                     # by bootstrap (bcrypt in argocd-secret)
    accounts.xenomit-tofu: "apiKey"    # OpenTofu/Atlantis; not a UI login
    # annotation+label: the `argocd.argoproj.io/tracking-id` ANNOTATION is
    # authoritative for tracking (the app.kubernetes.io/instance label is
    # informational only). This is what the operator's stamps rely on —
    # `<app>:<group>/<kind>:<ns>/<name>`, self-referencing, always written
    # from the object's own metadata (operator/src/argocd.rs).
    application.resourceTrackingMethod: "annotation+label"
    timeout.reconciliation: 180s       # relaxed poll — kind to a single node
    #
    # IMPORTANT — fleet.xenomit.io is deliberately NOT in `resource.exclusions`.
    # resource.exclusions would hide Bot/BotRollout/Proxy objects AND their
    # pods from the UI entirely (nothing tracked, nothing shown). The goal is
    # "never synced, still visible", so exclusion is done at the *sync* layer:
    # AppProject namespaceResourceBlacklist + deny-all syncWindow on the
    # xenomit-bots app + per-resource Prune=false,Delete=false stamps.
    # See apps/00-project.yaml and README §"What the UI shows".
    #
    # Health for XenomitBot CRs in the xenomit-bots tree — the built-in
    # checks don't know fleet.xenomit.io. Maps status.phase
    # (fleet-types/src/phase.rs, camelCase serde names) to Argo health:
    #   running                                   -> Healthy
    #   paused, stopped, deletedAtUnixMs set      -> Suspended (intentional)
    #   needsHuman, needsUpdate, failed,
    #   quarantined, invalidConfig                -> Degraded (actionable)
    #   pending, provisioning, armed, starting,
    #   draining, snapshotting, terminated        -> Progressing
    # Lua 5.1 for gopher-lua; reviewed against the phase enum — no lua
    # runtime on this machine, so the table is asserted in the ops README
    # and must be confirmed once live (kubectl argocd-cm + UI badge).
    resource.customizations.health.fleet.xenomit.io_XenomitBot: |
      hs = {}
      if obj.status == nil or obj.status.phase == nil then
        hs.status = "Progressing"
        hs.message = "awaiting first reconcile"
        return hs
      end

      -- Soft-deleted bots: credentials already destroyed, draining to
      -- Stopped; the row purges after the retention window (docs/12 §12.4).
      if obj.status.deletedAtUnixMs ~= nil then
        hs.status = "Suspended"
        hs.message = "soft-deleted; purges after retention"
        return hs
      end

      local phase = obj.status.phase
      hs.message = "phase: " .. phase

      if phase == "running" then
        hs.status = "Healthy"
      elseif phase == "paused" or phase == "stopped" then
        hs.status = "Suspended"
      elseif phase == "needsHuman" then
        hs.status = "Degraded"
        if obj.status.needsHuman ~= nil then
          hs.message = "needs human: " .. obj.status.needsHuman
        end
      elseif phase == "failed" or phase == "quarantined"
          or phase == "invalidConfig" or phase == "needsUpdate" then
        hs.status = "Degraded"
      else
        -- pending, provisioning, armed, starting, draining,
        -- snapshotting, terminated (transient between epochs)
        hs.status = "Progressing"
      end
      return hs
  rbac:
    policy.csv: |
      g, admin, role:admin       # owner
      g, viewer, role:readonly   # look-don't-touch UI account
      p, xenomit-tofu, projects, *, xenomit, allow
      p, xenomit-tofu, projects, *, xenomit-platform-runners, allow
      p, xenomit-tofu, applications, *, xenomit/*, allow
      p, xenomit-tofu, applications, *, xenomit-platform-runners/*, allow
      p, xenomit-tofu, clusters, get, *, allow
      p, xenomit-tofu, repositories, get, *, allow
    policy.default: ''           # no implicit role — only named accounts exist
    scopes: '[sub, groups]'
  secret:
    createSecret: true     # argocd-secret — bootstrap/1-services passes the bcrypt
                         # admin and viewer hashes as extra chart values (never
                         # committed; plaintext only in cluster secret
                         # argocd-local-accounts).
