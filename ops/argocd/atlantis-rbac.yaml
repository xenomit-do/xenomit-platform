# Cluster-wide rights for the atlantis ServiceAccount. The platform stack creates
# namespaces, CRDs, RBAC and Kyverno policies, so Atlantis needs cluster scope.
# Applied by bootstrap/3-tokens together with the Atlantis Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: atlantis-platform
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: atlantis-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: atlantis-platform
subjects:
  - kind: ServiceAccount
    name: atlantis
    namespace: ci
