# Role that lets the atlantis ServiceAccount keep OpenTofu state Secrets in
# namespace atlantis-state. The namespace itself is created by bootstrap/1-services.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlantis-state-access
  namespace: atlantis-state
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlantis-state-access
  namespace: atlantis-state
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
subjects:
  - kind: ServiceAccount
    name: atlantis
    namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlantis-state-access