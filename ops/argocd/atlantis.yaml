# Atlantis is the in-cluster Gitea PR planner and OpenTofu runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlantis
  namespace: ci
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlantis-data
  namespace: ci
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis
  namespace: ci
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis
        app.kubernetes.io/part-of: xenomit
    spec:
      serviceAccountName: atlantis
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: atlantis
          image: ghcr.io/runatlantis/atlantis:v0.46.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4141
              protocol: TCP
          env:
            - name: ATLANTIS_PORT
              value: "4141"
            - name: ATLANTIS_DATA_DIR
              value: /atlantis-data
            - name: ATLANTIS_ATLANTIS_URL
              value: http://atlantis.ci.svc.cluster.local:4141
            - name: ATLANTIS_GITEA_BASE_URL
              value: http://gitea.git.svc.cluster.local:3000
            - name: ATLANTIS_GITEA_PAGE_SIZE
              value: "30"
            - name: ATLANTIS_REPO_ALLOWLIST
              value: gitea.git.svc.cluster.local:3000/xenomit/xenomit-platform,gitea.git.svc.cluster.local:3000/xenomit/xenomit-platform-gitea,gitea.git.svc.cluster.local:3000/xenomit/xenomit-platform-argocd,gitea.git.svc.cluster.local/xenomit/xenomit-platform,gitea.git.svc.cluster.local/xenomit/xenomit-platform-gitea,gitea.git.svc.cluster.local/xenomit/xenomit-platform-argocd
            - name: ATLANTIS_DEFAULT_TF_DISTRIBUTION
              value: opentofu
            - name: ATLANTIS_DEFAULT_TF_VERSION
              value: 1.12.6
            - name: ATLANTIS_AUTOMERGE
              value: "true"
            - name: ATLANTIS_RESTRICT_FILE_LIST
              value: "true"
            - name: ATLANTIS_SILENCE_NO_PROJECTS
              value: "true"
            - name: ATLANTIS_ALLOW_FORK_PRS
              value: "false"
            - name: ATLANTIS_GITEA_USER
              valueFrom:
                secretKeyRef:
                  name: atlantis-vcs
                  key: ATLANTIS_GITEA_USER
            - name: ATLANTIS_GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlantis-vcs
                  key: ATLANTIS_GITEA_TOKEN
            - name: ATLANTIS_GITEA_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: atlantis-vcs
                  key: ATLANTIS_GITEA_WEBHOOK_SECRET
            - name: TF_VAR_gitea_token
              valueFrom:
                secretKeyRef:
                  name: atlantis-vcs
                  key: ATLANTIS_GITEA_TOKEN
            - name: TF_VAR_atlantis_webhook_secret
              valueFrom:
                secretKeyRef:
                  name: atlantis-vcs
                  key: ATLANTIS_GITEA_WEBHOOK_SECRET
            - name: TF_VAR_argocd_auth_token
              valueFrom:
                secretKeyRef:
                  name: atlantis-iac
                  key: ARGOCD_AUTH_TOKEN
            # GitHub token for the push mirrors in xenomit-platform-gitea. The Secret exists
            # only when bootstrap was given a token file (it is copied from Vault).
            - name: TF_VAR_github_mirror_username
              valueFrom:
                secretKeyRef:
                  name: atlantis-mirror
                  key: GITHUB_MIRROR_USERNAME
                  optional: true
            - name: TF_VAR_github_mirror_token
              valueFrom:
                secretKeyRef:
                  name: atlantis-mirror
                  key: GITHUB_MIRROR_TOKEN
                  optional: true
            # The pod runs as uid 1000 with HOME=/, where Helm's default cache (/.cache/helm)
            # cannot exist. The helm_release resources (Kyverno) need a writable cache, and
            # the directory has to exist already, so it is the root of an emptyDir.
            - name: HELM_REPOSITORY_CACHE
              value: /helm
            - name: HELM_REPOSITORY_CONFIG
              value: /helm/repositories.yaml
            - name: HELM_CACHE_HOME
              value: /helm
            - name: HELM_CONFIG_HOME
              value: /helm
            - name: HELM_DATA_HOME
              value: /helm
          volumeMounts:
            - name: data
              mountPath: /atlantis-data
            - name: helm
              mountPath: /helm
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atlantis-data
        - name: helm
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlantis
  namespace: ci
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: xenomit
spec:
  type: ClusterIP
  clusterIP: 10.43.189.172 # Reserved for the Gitea webhook allowlist.
  selector:
    app.kubernetes.io/name: atlantis
  ports:
    - name: http
      port: 4141
      targetPort: http
      protocol: TCP