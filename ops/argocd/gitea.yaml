# Minimal in-cluster Gitea. Applied by bootstrap/1-services (OpenTofu).
# The namespace, Secret gitops-git and ConfigMap gitea-bootstrap are created there.
# Argo CD and Atlantis use the in-cluster Service. SQLite is on PVC git/gitea-data.
# This Service stays ClusterIP. The host reaches Gitea through the loopback
# NodePort in ops/k3d/localhost-core.yaml (127.0.0.1:3000). SSH is
# disabled (HTTP clone only). Xenomit repos stay private; Argo receives a
# scoped read-only token, while writes use the separate `gitops` and CI
# publisher accounts.
# The namespace has no NetworkPolicy, so treat cluster-internal HTTP access as
# trusted (documented in README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: git
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: git
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: xenomit
spec:
  replicas: 1
  strategy:
    type: Recreate            # sqlite + a single RWO PVC — no rolling window
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: xenomit
    spec:
      automountServiceAccountToken: false  # gitea never calls the Kubernetes API
      securityContext:
        fsGroup: 1000                     # gitea runs as user `git` (uid 1000)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.25.5
          imagePullPolicy: IfNotPresent
          env:
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__security__INSTALL_LOCK
              value: "true"               # no install wizard — envs are the config
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "true"               # bootstrap creates managed local accounts; no public registration
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"              # public repos may be anonymous; Xenomit repos stay private
            - name: GITEA__actions__ENABLED
              value: "true"
            - name: GITEA__server__DISABLE_SSH
              value: "true"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__server__ROOT_URL
              value: "http://gitea.git.svc.cluster.local:3000/"
            - name: GITEA__webhook__ALLOWED_HOST_LIST
              value: 10.43.189.172
            - name: GITOPS_PASSWORD     # read by /bootstrap/gitea-admin.sh (kubectl exec)
              valueFrom:
                secretKeyRef: { name: gitops-git, key: password }
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: bootstrap, mountPath: /bootstrap, readOnly: true }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: bootstrap
          configMap:
            name: gitea-bootstrap
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: git
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: xenomit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - { name: http, port: 3000, targetPort: http }
