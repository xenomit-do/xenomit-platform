# Host access for the workload UIs. Applied by stacks/90-post once the
# platform stack has created the target namespaces.
#   127.0.0.1:5080  OpenObserve    nodePort 30580
#   127.0.0.1:3002  Xenomit panel  nodePort 30302
#   127.0.0.1:5433  PostgreSQL      nodePort 30433
apiVersion: v1
kind: Service
metadata:
  name: openobserve-localhost
  namespace: observability
  labels:
    app.kubernetes.io/name: openobserve-localhost
    app.kubernetes.io/part-of: xenomit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: openobserve
  ports:
    - name: http
      port: 5080
      targetPort: http
      nodePort: 30580
---
apiVersion: v1
kind: Service
metadata:
  name: web-panel-localhost
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: web-panel-localhost
    app.kubernetes.io/part-of: xenomit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: xenomit-web-panel
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30302
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-localhost
  namespace: xenomit-data
  labels:
    app.kubernetes.io/name: postgres-localhost
    app.kubernetes.io/part-of: xenomit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30433
