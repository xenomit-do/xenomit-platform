# Host access for Argo CD and Gitea. Applied by bootstrap/1-services; the
# platform and seed stages talk to both through these loopback ports.
# Ports are published on 127.0.0.1 by ops/k3d/cluster.yaml (NodePort == container port).
#   127.0.0.1:8080  Argo CD  nodePort 30080
#   127.0.0.1:3000  Gitea    nodePort 30300
apiVersion: v1
kind: Service
metadata:
  name: argocd-server-localhost
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server-localhost
    app.kubernetes.io/part-of: xenomit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/name: argocd-server
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-localhost
  namespace: git
  labels:
    app.kubernetes.io/name: gitea-localhost
    app.kubernetes.io/part-of: xenomit
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
