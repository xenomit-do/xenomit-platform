# Orchestrator REST API (docs/04 §4.6): the panel's admin surface —
# bot lifecycle, rollouts, proxies, fleet summary, SSE. Served by the
# single-process `xenomit-orchestratord` pod (Deployment in operator.yaml);
# this Service keeps the stable DNS name the panel resolves via
# ORCHESTRATOR_URL (http://orchestrator-api.xenomit-system:8080).
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: xenomit-orchestrator-api
    app.kubernetes.io/part-of: xenomit-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xenomit-orchestratord
  ports:
    - { name: http, port: 8080, targetPort: http }
