# `xenomit-orchestratord` — the single-process control plane: BotController/
# RolloutController/ProxyController drivers + control gateway (:8443) + REST
# API (:8080) in one pod. The docs/04 §4.7 split (operator / gateway / api as
# separate Deployments behind a leader Lease) is future work: today
# `Gateway` is both the bot-facing tonic service and the operator's
# in-process ControlDirectory, so the same binary runs every concern.
#
# replicas: 1 — no leader election exists yet; a second replica would
# double-reconcile.
#
# Contract with the bot egress NetworkPolicy: the control-plane pod MUST
# carry label `xenomit.io/component: gateway` and serve TCP 8443 in
# xenomit-system — the bot egress NetworkPolicy selects on exactly that.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: xenomit-orchestratord
    app.kubernetes.io/part-of: xenomit-control-plane
# The SA name is a Vault contract: xenomit-platform/ops/vault/vault-configure-jwt.ps1 binds
# jwt role `orchestrator` to subject system:serviceaccount:xenomit-system:orchestrator.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenomit-orchestratord
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: xenomit-orchestratord
    app.kubernetes.io/part-of: xenomit-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate   # no leader election: never run two reconcilers
  selector:
    matchLabels:
      app.kubernetes.io/name: xenomit-orchestratord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xenomit-orchestratord
        app.kubernetes.io/part-of: xenomit-control-plane
        xenomit.io/component: gateway
    spec:
      serviceAccountName: orchestrator
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestratord
          image: xenomit-orchestrator
          command: ["/usr/local/bin/xenomit-orchestratord"]
          args:
            - --mode
            - kube
            - --api-bind
            - 0.0.0.0:8080
            - --gateway-bind
            - 0.0.0.0:8443
            - --bots-namespace
            - xenomit-bots
            - --control-endpoint
            - http://control-gateway.xenomit-system:8443
            - --vault-addr
            - https://vault.xenomit-system:8200
            - --vault-mount
            - jwt
            - --vault-role
            - orchestrator
            - --vault-token-file
            - /var/run/secrets/vault/token
            - --public-key
            - /etc/xenomit/jwt-public.pem
            - --panel-url
            - http://web-panel.xenomit-system:3000
            - --service-token
            - $(PANEL_SERVICE_TOKEN)
            - --stable-image
            - xenomit-botd:local
            - --database-url
            - $(DATABASE_URL)
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 8443 }
          env:
            - name: RUST_LOG
              value: info
            # hostPort collector path (docs/06 §6.7): telemetry does not
            # depend on a Service hop.
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(NODE_IP):4317"
            # Panel pairing + Postgres DSN — ops-managed secrets in
            # xenomit-system; key names are the contract, values never are.
            - name: PANEL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xenomit-api-jwt
                  key: service-token
                  optional: true   # absent disables panel pairing gracefully
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: orchestrator-url
                  optional: true   # build without --features postgres ignores it
          volumeMounts:
            - { name: jwt-key, mountPath: /etc/xenomit, readOnly: true }
            - { name: vault-token, mountPath: /var/run/secrets/vault, readOnly: true }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
      volumes:
        - name: jwt-key
          secret:
            secretName: xenomit-api-jwt   # created by ops, not by GitOps
        # Projected SA token with audience "vault" — this is what the jwt
        # auth mount verifies (NOT the default automounted token).
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: vault
                  expirationSeconds: 3600
