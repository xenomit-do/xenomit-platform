# Independently deployed web panel. The digest is promoted by
# Digest pins updated by xenomit-deployments when source image.yml publishes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - panel.yaml
  - panel-orchestrator-network-policy.yaml

images:
  - name: xenomit-web-panel
    newName: xenomit-registry:5000/xenomit-web-panel
    digest: sha256:ee628d8e081492ba616d360650455aa76817e6203a60c158e119d4882bc469d1

labels:
  - pairs:
      app.kubernetes.io/managed-by: gitops
    includeSelectors: false
