# Web panel (docs/08): Next.js app + agent-protocol WebSocket data plane.
# Contract with the bot NetworkPolicy: data-plane pods carry
# `xenomit.io/component: panel` on TCP 3000.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xenomit-web-panel
  namespace: xenomit-system
automountServiceAccountToken: false   # the panel holds no Kubernetes API need
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xenomit-web-panel
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: xenomit-web-panel
    app.kubernetes.io/part-of: xenomit-control-plane
spec:
  replicas: 1   # single-writer panel; scale out with the panel phase
  selector:
    matchLabels:
      app.kubernetes.io/name: xenomit-web-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xenomit-web-panel
        app.kubernetes.io/part-of: xenomit-control-plane
        xenomit.io/component: panel
    spec:
      serviceAccountName: xenomit-web-panel
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        fsGroup: 1000
      containers:
        - name: panel
          image: xenomit-web-panel
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - name: NODE_ENV
              value: production
            # The custom server uses HOSTNAME as its bind address. Kubernetes
            # otherwise injects the pod name here, which binds only to the pod
            # IP and breaks kubectl port-forward's localhost target.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: xenomit-panel-auth
                  key: AUTH_SECRET
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://$(NODE_IP):4317"
            # Prisma DSN + auth secrets come from ops-managed secrets;
            # key names are the contract, values stay out of git.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: panel-url
            # Real orchestrator integration (docs/08 §8.6): the panel mints
            # EdDSA JWTs with the private half of xenomit-api-jwt; the
            # orchestratord Deployment verifies the public half.
            - name: ORCHESTRATOR_URL
              value: http://orchestrator-api.xenomit-system:8080
            - name: ORCHESTRATOR_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: xenomit-api-jwt
                  key: jwt-private.pem
            - name: ORCHESTRATOR_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: xenomit-api-jwt
                  key: service-token
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web-panel
  namespace: xenomit-system
  labels:
    app.kubernetes.io/name: xenomit-web-panel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: xenomit-web-panel
  ports:
    - { name: http, port: 3000, targetPort: http }
