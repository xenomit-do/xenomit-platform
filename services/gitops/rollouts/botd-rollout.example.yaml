# BotRollout — normal lane (docs/04 §4.1, docs/07 §7.3).
# Reference fleet/botd-image.json after botd image.yml publishes a new digest
# (rendered to botd-rollout.rendered.yaml), or by hand / the panel's
# Rollback button. The RolloutController executes canary → waves under
# the concurrency caps; Kubernetes never rolls bot pods directly.
apiVersion: fleet.xenomit.io/v1alpha1
kind: BotRollout
metadata:
  name: botd-rollout
  namespace: xenomit-system
spec:
  # Filled by the pipeline: xenomit-registry:5000/xenomit-botd@sha256:…
  targetImage: xenomit-registry:5000/xenomit-botd@sha256:REPLACE_ME
  selector:
    channel: stable          # stable | canary | pinned — only matching bots roll
  strategy:
    canary:
      count: 3
      bakeMinutes: 20
      bots: []               # pinned internal canary bots (optional)
    waves:
      maxDraining: 25%       # share of fleet simultaneously draining
      maxOffline: 5          # hard cap on bots offline at once
      interWaveDelayS: 120
      loginJitterS: 30       # spreads logins inside a wave
    gates:
      maxFailedRestores: 0
      maxLoginFailureRatePermille: 20    # 2%
      minRewardRateRatio: 0.7
  onGateFailure: pause       # pause | rollback
