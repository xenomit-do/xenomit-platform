# Game-update pipeline, stage 1 (docs/07 §7.1): detect CronJob.
#
# Every 10 minutes: fetch main.swf → `xenomit-packet-updater detect`.
# Exit 0 stops; exit 10/30 renders the apply-Job template (the ConfigMap
# below) and kubectl-applies it — the Job does the FFDec decompile on a
# fresh checkout and opens the auto/packet-* PR.
#
# RBAC: the CronJob's ServiceAccount may only create Jobs in the ci
# namespace — nothing else. The apply Job's git credential is a scoped
# deploy key that can push auto/* branches but never main (docs/09 §9.2).
#
# Apply:  kubectl apply -f ci/packet-updater/cronjob-detect.yaml
# Edit SWF_URL/FLASHVARS_URL and EXECUTE before relying on it.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: packet-updater
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: packet-updater
  namespace: ci
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: packet-updater
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: packet-updater
subjects:
  - kind: ServiceAccount
    name: packet-updater
    namespace: ci
---
# The apply-Job template the detect step renders. Tokens __JOB_NAME__,
# __IMAGE__, __NAMESPACE__, __SWF_URL__, __FLASHVARS_URL__ are sed-filled
# by detect-pr-flow.sh at spawn time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: packet-updater-job-template
  namespace: ci
data:
  job-apply.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: __JOB_NAME__
      namespace: __NAMESPACE__
      labels:
        app.kubernetes.io/name: packet-updater
        xenomit.io/pipeline: game-update
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: packet-updater
          restartPolicy: Never
          securityContext:
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: apply
              image: __IMAGE__
              args: ["apply"]
              env:
                - { name: SWF_URL, value: "__SWF_URL__" }
                - { name: FLASHVARS_URL, value: "__FLASHVARS_URL__" }
                - { name: REPO_URL, value: "git@github.com:OWNER/xenomit.git" }  # edit me
                - { name: GIT_BRANCH, value: "main" }
                # 0 = dry-run (commit locally, print the would-be push/PR);
                # 1 = push auto/* + open the PR. Flip deliberately.
                - { name: EXECUTE, value: "0" }
                - { name: GIT_SSH_COMMAND, value: "ssh -i /git-secret/deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits: { cpu: "1", memory: 1Gi }   # FFDec/JVM spike
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: git-secret, mountPath: /git-secret, readOnly: true }
                - { name: work, mountPath: /tmp/xpu }
          volumes:
            # Scoped deploy key / GitHub App token: auto/* branches + PRs
            # only, NO push to main (docs/07 §7.1, docs/09 §9.2).
            - name: git-secret
              secret:
                secretName: packet-updater-git
                defaultMode: 0400
            - { name: work, emptyDir: {} }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: packet-update-detect
  namespace: ci
  labels:
    app.kubernetes.io/name: packet-updater
    xenomit.io/pipeline: game-update
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300   # fetch + sha256 is seconds of work
      template:
        spec:
          serviceAccountName: packet-updater
          restartPolicy: Never
          securityContext:
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: detect
              image: xenomit-registry:5000/xenomit-packet-updater:latest
              args: ["detect"]
              env:
                # Direct CDN URL, or FLASHVARS_URL (backpage flashvars →
                # main.swf?__cv=). Set ONE; fetching stays outside the tool.
                - { name: SWF_URL, value: "" }
                - { name: FLASHVARS_URL, value: "" }
                - { name: JOB_TEMPLATE, value: /etc/xenomit/job-apply.yaml }
                - { name: APPLY_IMAGE, value: xenomit-registry:5000/xenomit-packet-updater:latest }
                - { name: APPLY_NAMESPACE, value: ci }
                - { name: EXECUTE, value: "0" }   # 1 = really spawn the Job
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                runAsNonRoot: true
                runAsUser: 10001
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: job-template, mountPath: /etc/xenomit, readOnly: true }
                - { name: work, mountPath: /tmp/xpu }
          volumes:
            - name: job-template
              configMap:
                name: packet-updater-job-template
            - { name: work, emptyDir: {} }
