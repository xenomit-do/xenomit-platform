# Game-update pipeline, stage 2 (docs/07 §7.1): the apply Job.
#
# Same manifest as the `packet-updater-job-template` ConfigMap in
# cronjob-detect.yaml — kept standalone for one-shot/manual runs and
# dry-run rehearsals:
#
#   sed -e 's/__JOB_NAME__/packet-apply-manual/' \
#       -e 's|__IMAGE__|xenomit-registry:5000/xenomit-packet-updater:latest|' \
#       -e 's|__NAMESPACE__|ci|' \
#       -e 's|__SWF_URL__|<cdn url>|' -e 's|__FLASHVARS_URL__||' \
#       ci/packet-updater/job-apply.yaml | kubectl apply -f -
#
# The Job clones the repo fresh, runs `apply --ffdec` (FFDec is baked into
# the image), writes upgrade.json, branches auto/packet-<hash>, and —
# EXECUTE=1 only — pushes the branch and opens the PR with upgrade.json as
# the body. With EXECUTE=0 it does everything except the push/PR (logs show
# the rendered git commands).
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: packet-updater
    xenomit.io/pipeline: game-update
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      serviceAccountName: packet-updater
      restartPolicy: Never
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: apply
          image: __IMAGE__
          args: ["apply"]
          env:
            - { name: SWF_URL, value: "__SWF_URL__" }
            - { name: FLASHVARS_URL, value: "__FLASHVARS_URL__" }
            - { name: REPO_URL, value: "git@github.com:OWNER/xenomit.git" }  # edit me
            - { name: GIT_BRANCH, value: "main" }
            - { name: EXECUTE, value: "0" }
            - { name: GIT_SSH_COMMAND, value: "ssh -i /git-secret/deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: git-secret, mountPath: /git-secret, readOnly: true }
            - { name: work, mountPath: /tmp/xpu }
      volumes:
        - name: git-secret
          secret:
            secretName: packet-updater-git
            defaultMode: 0400
        - { name: work, emptyDir: {} }
